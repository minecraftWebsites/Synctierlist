<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncTiers - Leaderboard</title>
    <style>
        :root {
            --bg-dark: #0f0c29;
            --bg-mid: #25224d;
            --bg-light: #1c1c31;
            --accent: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --rank-gold: #ffd700;
            --rank-silver: #c0c0c0;
            --rank-bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to bottom right, var(--bg-dark), var(--bg-mid), var(--bg-light));
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            background: rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .official-badge {
            background: #00c853;
            color: white;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(0, 200, 83, 0.6);
            white-space: nowrap;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            justify-content: flex-start;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .container {
            max-width: 800px;
            margin: 15px auto;
            padding: 0 12px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-card:hover {
            background: rgba(0, 242, 254, 0.1);
            transform: translateY(-2px);
        }

        /* Founder Glowing Card Effect */
        .rank-founder {
            border: 2px solid #ff0055 !important;
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.15), rgba(0, 242, 254, 0.15)) !important;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            animation: founderPulse 2s infinite alternate;
        }

        @keyframes founderPulse {
            0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); border-color: #ff0055; }
            100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.8), 0 0 10px rgba(0, 242, 254, 0.8); border-color: #00f2fe; }
        }

        .founder-badge {
            background: linear-gradient(135deg, #ff0055, #ff7700);
            color: #fff;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
            animation: badgeGlow 1.5s infinite alternate;
            margin-left: 6px;
            display: inline-block;
        }

        .tester-badge {
            background: linear-gradient(135deg, #ff0033, #ff4d4d);
            color: #fff;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(255, 0, 51, 0.8);
            animation: badgeGlow 1.5s infinite alternate;
            margin-left: 6px;
            display: inline-block;
        }

        .sync-badge {
            background: linear-gradient(135deg, #0077ff, #00f2fe);
            color: #fff;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            animation: blueBadgeGlow 1.5s infinite alternate;
            margin-left: 6px;
            display: inline-block;
        }

        @keyframes badgeGlow {
            from { box-shadow: 0 0 4px #ff0055; }
            to { box-shadow: 0 0 12px #ff7700, 0 0 6px #fff; }
        }

        @keyframes blueBadgeGlow {
            from { box-shadow: 0 0 4px #0077ff; }
            to { box-shadow: 0 0 12px #00f2fe, 0 0 6px #fff; }
        }

        .rank-1 { border: 1px solid var(--rank-gold); animation: pulseGold 2s infinite; background: rgba(255, 215, 0, 0.05); }
        .rank-2 { border: 1px solid var(--rank-silver); background: rgba(192, 192, 192, 0.05); }
        .rank-3 { border: 1px solid var(--rank-bronze); background: rgba(205, 127, 50, 0.05); }

        @keyframes pulseGold {
            0% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 16px rgba(255, 215, 0, 0.5); }
            100% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.2); }
        }

        .rank {
            font-size: 18px;
            font-weight: bold;
            width: 36px;
            color: var(--text-sub);
        }

        .rank-1 .rank { color: var(--rank-gold); }
        .rank-2 .rank { color: var(--rank-silver); }
        .rank-3 .rank { color: var(--rank-bronze); }

        .player-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            margin-right: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #111;
            object-fit: cover;
        }

        .player-info {
            flex-grow: 1;
        }

        .player-name {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .player-title {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .region-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #131324;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 22px;
            border: 2px solid var(--accent);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px; height: 28px;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-avatar {
            width: 70px; height: 70px;
            margin-bottom: 8px;
            border-radius: 8px;
            object-fit: cover;
        }

        .modal-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent);
        }

        .tier-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .tier-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
            width: 70px;
        }

        .tier-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            image-rendering: pixelated;
        }

        .tier-rank {
            font-size: 12px;
            font-weight: bold;
        }

        .ht1 { color: #d633ff; }
        .lt1 { color: #ff3333; }
        .ht2 { color: #33aaff; }
        .lt2 { color: #33ffaa; }
        .ht3 { color: #ffaa33; }
        .lt3 { color: #aaaaaa; }
        .ht4 { color: #8888ff; }
        .lt4 { color: #777777; }
        .ht5 { color: #555555; }
        .n-a { color: var(--text-sub); }
    </style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>SyncTiers</h1>
            <span class="official-badge">OFFICIAL TIERLIST</span>
        </div>
        <div class="controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search player by name..." oninput="applyFilters()">
            <div class="filters">
                <button class="filter-btn active" onclick="setRegion('ALL', this)">ALL</button>
                <button class="filter-btn" onclick="setRegion('NA', this)">NA</button>
                <button class="filter-btn" onclick="setRegion('EU', this)">EU</button>
                <button class="filter-btn" onclick="setRegion('ME', this)">ME</button>
                <button class="filter-btn" onclick="setRegion('SA', this)">SA</button>
                <button class="filter-btn" onclick="setRegion('AS', this)">AS</button>
                <button class="filter-btn" onclick="setRegion('AU', this)">AU</button>
            </div>
        </div>
    </header>

    <div class="container" id="leaderboard"></div>

    <div class="modal-overlay" id="playerModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(null, true)">✕</button>
            <img class="modal-avatar" id="modalAvatar" src="" alt="Player Avatar">
            <div class="modal-name" id="modalName">PlayerName</div>
            <div class="player-title" id="modalTitle">Combat Title</div>
            
            <h3 style="margin-top: 12px; font-size: 12px; color: #b3b3b3; letter-spacing: 1px;">GAMEMODE TIERS</h3>
            
            <div class="tier-grid" id="modalTiers"></div>
        </div>
    </div>

    <script>
        const itemCDN = "https://cdn.jsdelivr.net/gh/InventivetalentDev/minecraft-assets@1.20.2/assets/minecraft/textures/item/";
        const modes = [
            { id: "Crystal", icon: itemCDN + "end_crystal.png" },
            { id: "SMP", icon: itemCDN + "ender_pearl.png" },
            { id: "NethPot", icon: itemCDN + "netherite_helmet.png" },
            { id: "UHC", icon: itemCDN + "golden_apple.png" },
            { id: "Mace", icon: itemCDN + "trident.png" },
            { id: "Sword", icon: itemCDN + "diamond_sword.png" },
            { id: "Pot", icon: itemCDN + "splash_potion.png" },
            { id: "Axe", icon: itemCDN + "diamond_axe.png" },
            { id: "Vanilla", icon: itemCDN + "apple.png" }
        ];

        let activeRegion = 'ALL';
        const focusedAvatar = "./1000070920.png";
        const earltzyAvatar = "./1000071027.png";

        // MCTiers Title Calculator
        function getMCTiersTitle(score) {
            if (score >= 400) return `Combat Grandmaster (${score} pts)`;
            if (score >= 250) return `Combat Master (${score} pts)`;
            if (score >= 100) return `Combat Ace (${score} pts)`;
            if (score >= 50) return `Combat Specialist (${score} pts)`;
            if (score >= 20) return `Combat Cadet (${score} pts)`;
            if (score >= 10) return `Combat Novice (${score} pts)`;
            if (score >= 1) return `Combat Rookie (${score} pts)`;
            return `Unranked (${score} pts)`;
        }

        // Players Database
        const players = [
            { isFounder: true, name: "C_H_A_M_B_E_R", region: "AS", score: 150, tiers: ["HT1"] },
            { name: "kingofhells", region: "AS", score: 100, tiers: ["N/A", "LT4", "LT4"] },
            { name: "QaxSyndicate", region: "AS", score: 95, tiers: ["LT2"] },
            { name: "Focused", region: "AS", score: 75, customAvatar: focusedAvatar, tiers: ["LT3"] },
            { name: "Kuraii_", region: "AS", score: 75, tiers: ["N/A", "N/A", "N/A", "N/A", "N/A", "LT3"] },
            { isTester: true, name: "Earltzyblox", region: "AS", score: 75, customAvatar: earltzyAvatar, tiers: ["LT4", "HT4", "LT3", "LT3", "N/A", "LT3", "LT3"] },
            { name: "Pangshie", region: "AS", score: 50, tiers: ["HT4"] },
            { isFounder: true, name: "WynFx", region: "AS", score: 35, tiers: ["LT4", "N/A", "LT4"] },
            { name: "x1nnstox", region: "AS", score: 35, tiers: ["LT4"] },
            { name: "vacentii", region: "AS", score: 35, tiers: ["LT4"] },
            { name: "R31NH4RT", region: "AS", score: 35, tiers: ["LT4"] },
            { name: "EightNineKen", region: "AS", score: 20, tiers: ["N/A", "N/A", "HT5"] },
            { name: "Cox", region: "AS", score: 10, tiers: ["LT5"] },
            { name: "AblazeShadow", region: "AS", score: 10, tiers: ["LT5"] }
        ];

        // Ensure title is calculated dynamically
        players.forEach(p => {
            if (!p.title) {
                p.title = getMCTiersTitle(p.score);
            }
        });

        function renderLeaderboard() {
            const container = document.getElementById("leaderboard");
            const query = document.getElementById("searchInput").value.toLowerCase();
            container.innerHTML = "";

            // Strict Point Sorting: Highest points top, lowest bottom
            players.sort((a, b) => b.score - a.score);

            const filteredPlayers = players.filter(p => {
                const matchesName = p.name.toLowerCase().includes(query);
                const matchesRegion = activeRegion === 'ALL' || p.region === activeRegion;
                return matchesName && matchesRegion;
            });

            if(filteredPlayers.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#b3b3b3; padding: 20px;'>No players found.</p>";
                return;
            }

            filteredPlayers.forEach((player, index) => {
                let rankClass = player.isFounder ? "rank-founder" : (index === 0 ? "rank-1" : (index === 1 ? "rank-2" : (index === 2 ? "rank-3" : "")));
                const avatarUrl = player.customAvatar ? player.customAvatar : ("https://mc-heads.net/avatar/" + player.name + "/38");
                
                const founderTag = player.isFounder ? '<span class="founder-badge">FOUNDER</span>' : '';
                const testerTag = player.isTester ? '<span class="tester-badge">TESTER</span>' : '';
                const syncTag = '<span class="sync-badge">SYNC</span>';
                
                const displayRank = (index + 1) + ".";
                
                const card = document.createElement("div");
                card.className = "player-card " + rankClass;
                card.onclick = function() { openModal(player); };
                
                card.innerHTML = `
                    <div class="rank">${displayRank}</div>
                    <img class="player-avatar" src="${avatarUrl}" alt="${player.name}" onerror="this.src='https://mc-heads.net/avatar/MHF_Steve/38'">
                    <div class="player-info">
                        <div class="player-name">${player.name} ${founderTag} ${testerTag} ${syncTag}</div>
                        <div class="player-title">🏅 ${player.title}</div>
                    </div>
                    <div class="region-badge">${player.region}</div>
                `;
                
                container.appendChild(card);
            });
        }

        function setRegion(region, btnElement) {
            activeRegion = region;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderLeaderboard();
        }

        function applyFilters() {
            renderLeaderboard();
        }

        const modal = document.getElementById("playerModal");

        function openModal(player) {
            document.getElementById("modalName").innerText = player.name;
            document.getElementById("modalTitle").innerText = player.title;
            const avatarUrl = player.customAvatar ? player.customAvatar : ("https://mc-heads.net/head/" + player.name + "/70");
            document.getElementById("modalAvatar").src = avatarUrl;
            
            const tierGrid = document.getElementById("modalTiers");
            tierGrid.innerHTML = "";

            modes.forEach((mode, index) => {
                let tierVal = "";
                if (player.tiers && player.tiers[index]) {
                    tierVal = player.tiers[index];
                } else {
                    tierVal = "N/A";
                }
                
                const colorClass = tierVal.toLowerCase().replace('/', '-');

                tierGrid.innerHTML += `
                    <div class="tier-item">
                        <img class="tier-icon" src="${mode.icon}" alt="${mode.id}" title="${mode.id}">
                        <div class="tier-rank ${colorClass}">${tierVal}</div>
                    </div>
                `;
            });

            modal.classList.add("active");
        }

        function closeModal(e, forceClose) {
            if (forceClose || (e && e.target === modal)) {
                modal.classList.remove("active");
            }
        }

        renderLeaderboard();
    </script>
</body>
</html>
